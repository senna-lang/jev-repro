<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold v1 修正再回答</title><style>body{max-width:850px;margin:auto;padding:24px;font:16px/1.5 system-ui}fieldset{margin:24px 0;padding:16px;border:1px solid #bbb}blockquote{background:#f4f4f4;padding:12px;margin:8px 0}label{display:block;padding:6px}button{padding:10px 16px}</style><h1>Gold v1 修正branch 再回答</h1><p>8件すべてで最善の答えを1つ選び、迷った場合は曖昧をチェックしてください。</p><label>回答者ID <input id="id"></label><form id="f"></form><button id="out">JSONをダウンロード</button><p id="s"></p><script>let d,ans={};fetch('../private/gold_v1_revision_candidates.json').then(r=>r.json()).then(x=>{d=x;f.innerHTML=x.items.map((x,i)=>`<fieldset data-k="${x.id}"><b>${i+1}. ${x.branch.instructions}</b><blockquote>${x.state}</blockquote>${x.branch.options.map((o,j)=>`<label><input type="radio" name="${x.id}" value="${j}"> ${o}</label>`).join('')}<label><input type="checkbox" class="flag"> 判断が難しい・曖昧</label></fieldset>`).join('')});out.onclick=()=>{let a=[...document.querySelectorAll('fieldset')].map(e=>{let r=e.querySelector(':checked:not(.flag)');return{case_id:e.dataset.k,selection:r?+r.value:null,flagged:e.querySelector('.flag').checked}});if(!id.value||a.some(x=>x.selection===null)){s.textContent='IDと全回答が必要です';return}let b=new Blob([JSON.stringify({instrument:'gold-annotation-revision',form_version:'gold_v1-revision-1',annotator_id:id.value,answers:a},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),z=document.createElement('a');z.href=u;z.download='gold-v1-revision-'+id.value+'.json';z.click();URL.revokeObjectURL(u)};</script></html>
