<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold v1 アノテーション</title><style>
:root{--paper:#fbf7ee;--ink:#28231f;--muted:#70675d;--rule:#d5c8b8;--accent:#9b3924}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}.page{max-width:1040px;margin:auto;padding:32px 20px}header{border-bottom:3px solid var(--ink);padding-bottom:22px}h1{font:600 clamp(2.2rem,6vw,4rem)/.95 Georgia,serif;margin:.3rem 0}.eyebrow,.meta,.kind{font:12px/1.3 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}.eyebrow{color:var(--accent)}.meta{color:var(--muted)}.intro{display:grid;grid-template-columns:13rem 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--rule)}.intro h2{margin:0;font:600 14px/1.2 ui-monospace,monospace;color:var(--accent)}.intro p{margin:0}.identity,.progress{padding:16px 0;border-bottom:1px solid var(--rule)}input[type=text]{width:min(360px,100%);display:block;margin-top:5px;padding:9px;border:1px solid var(--ink);background:#fffdf8;font:inherit}.progress{position:sticky;top:0;background:var(--paper);z-index:2;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.track{height:7px;background:#e7ddd0}.bar{height:100%;width:0;background:var(--accent)}.case{padding:30px 0;border-bottom:1px solid var(--rule)}.case-id{color:var(--accent);font:12px ui-monospace,monospace}.state{margin:8px 0 0;padding:13px 15px;border-left:3px solid var(--ink);background:#f2e9dc;font:1.16rem/1.45 Georgia,serif}fieldset{border:0;margin:22px 0 0;padding:0}fieldset+fieldset{border-top:1px dashed var(--rule);padding-top:22px}legend{font-weight:700}.kind{display:inline-block;background:var(--ink);color:var(--paper);padding:2px 5px;margin-right:8px}.answers{display:grid;gap:6px;margin-top:9px}.answer{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px;border:1px solid var(--rule);cursor:pointer}.answer:has(input:checked){border-color:var(--accent);background:#fff4ee}.answer input{accent-color:var(--accent);margin-top:4px}.support{margin-top:8px;color:var(--muted);font-size:.92rem}.support input{accent-color:var(--accent)}button{margin-top:28px;border:0;background:var(--accent);color:white;padding:12px 16px;font-weight:700;cursor:pointer}#status{color:var(--accent);font-weight:700}@media(max-width:600px){.intro{grid-template-columns:1fr}.page{padding:20px 14px}}
</style></head><body><main class="page"><header><p class="eyebrow">Blind human annotation · Gold v1</p><h1>サポート判断シート</h1><p class="meta" id="meta">読み込み中</p></header><section class="intro"><h2>回答ルール</h2><div><p>メッセージ、設問、選択肢だけを根拠に最善の答えを1つ選んでください。モデル・検索・他回答者の回答を参照しないでください。</p><p>判断が難しい場合も選択は必須です。そのうえで「判断が難しい・曖昧」をチェックしてください。回答はこのブラウザ内にだけ保存され、出力JSONを調査担当者へ渡します。</p></div></section><section class="identity"><label>回答者ID<input id="annotator" type="text" autocomplete="off" placeholder="例: evaluator-02"></label></section><section class="progress"><span>進捗</span><div class="track"><div id="bar" class="bar"></div></div><span id="progress">0 / 0</span></section><form id="form"></form><button id="export" type="button">回答JSONをダウンロード</button><p id="status" role="status"></p></main><script>
const VERSION='gold_v1',KEY='jev-gold-annotation-gold-v1';let cases=[],draft=load()??{annotator_id:'',answers:{}};const form=document.querySelector('#form'),status=document.querySelector('#status');
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify(draft))}function key(c,b){return c+'::'+b}function options(b){return b.kind==='noul'?[['はい',true],['いいえ',false]]:b.options.map((x,i)=>[x,i])}
async function start(){const response=await fetch('../private/gold_v1_candidates.jsonl');if(!response.ok)throw Error('候補データを読み込めません');cases=(await response.text()).trim().split('\n').map(JSON.parse);document.querySelector('#annotator').value=draft.annotator_id||'';document.querySelector('#meta').textContent=`${cases.length} requests / ${cases.reduce((n,c)=>n+c.branches.length,0)} judgments`;render()}
function render(){const frag=document.createDocumentFragment();cases.forEach((c,i)=>{const section=document.createElement('section');section.className='case';section.innerHTML=`<div class="case-id">CASE ${String(i+1).padStart(2,'0')}</div><blockquote class="state"></blockquote>`;section.querySelector('.state').textContent=c.state;c.branches.forEach((b,j)=>{const k=key(c.id,b.id),old=draft.answers[k]??{selection:null,flagged:false};const fs=document.createElement('fieldset');fs.dataset.key=k;const legend=document.createElement('legend');legend.innerHTML=`<span class="kind">${b.kind==='noul'?'はい / いいえ':b.kind==='score'?'段階評価':'選択'}</span>設問 ${j+1}`;const p=document.createElement('p');p.textContent=b.instructions;const answers=document.createElement('div');answers.className='answers';options(b).forEach(([text,value])=>{const label=document.createElement('label');label.className='answer';const radio=document.createElement('input');radio.type='radio';radio.name=k;radio.checked=old.selection===value;radio.onchange=()=>{draft.answers[k]={...draft.answers[k]??{flagged:false},selection:value};save();progress()};const span=document.createElement('span');span.textContent=text;label.append(radio,span);answers.append(label)});const support=document.createElement('label');support.className='support';const flag=document.createElement('input');flag.type='checkbox';flag.checked=!!old.flagged;flag.onchange=()=>{draft.answers[k]={...draft.answers[k]??{selection:null},flagged:flag.checked};save()};support.append(flag,document.createTextNode(' 判断が難しい・曖昧である'));fs.append(legend,p,answers,support);section.append(fs)});frag.append(section)});form.replaceChildren(frag);progress()}
function branches(){return cases.flatMap(c=>c.branches.map(b=>({c,b})))}function progress(){const all=branches(),done=all.filter(({c,b})=>draft.answers[key(c.id,b.id)]?.selection!==undefined&&draft.answers[key(c.id,b.id)]?.selection!==null).length;document.querySelector('#bar').style.width=(100*done/all.length)+'%';document.querySelector('#progress').textContent=`${done} / ${all.length}`}
document.querySelector('#annotator').oninput=e=>{draft.annotator_id=e.target.value;save()};document.querySelector('#export').onclick=()=>{draft.annotator_id=document.querySelector('#annotator').value.trim();const missing=branches().filter(({c,b})=>draft.answers[key(c.id,b.id)]?.selection===undefined||draft.answers[key(c.id,b.id)]?.selection===null);if(!draft.annotator_id||missing.length){status.textContent=!draft.annotator_id?'回答者IDを入力してください。':`未回答が ${missing.length} 件あります。`;return}const payload={schema_version:1,instrument:'gold-annotation',form_version:VERSION,annotator_id:draft.annotator_id,submitted_at:new Date().toISOString(),answers:branches().map(({c,b})=>{const a=draft.answers[key(c.id,b.id)];return{case_id:c.id,branch_id:b.id,kind:b.kind,selection:a.selection,flagged:!!a.flagged,note:''}})};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`gold-annotation-${VERSION}-${payload.annotator_id}.json`;a.click();URL.revokeObjectURL(url);status.textContent='回答JSONをダウンロードしました。'};start().catch(e=>status.textContent=e.message);
</script></body></html>
